[project]
name = "hexlet-pytest"
version = "0.1.0"
description = "Example project for learning pytest"
authors = [{name = "Hexlet Team", email = "info@hexlet.io"}]
license = "ISC"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "ruff>=0.16.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "C90"]
